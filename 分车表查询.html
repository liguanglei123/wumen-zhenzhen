<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>分车表查询</title>
<style>
:root{
  --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#eff6ff;
  --bg:#f1f5f9; --card:#ffffff; --text:#1e293b; --muted:#64748b;
  --border:#e2e8f0; --green:#059669;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:28px 16px 88px;text-align:center}
.header h1{font-size:22px;font-weight:600;letter-spacing:2px}
.header p{font-size:12px;opacity:.85;margin-top:6px}
.search-wrap{max-width:720px;margin:-60px auto 0;padding:0 16px}
.search-box{background:var(--card);border-radius:12px;box-shadow:0 4px 20px rgba(30,64,175,.15);padding:16px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;height:46px;border:2px solid var(--border);border-radius:8px;padding:0 14px;font-size:16px;outline:none;transition:border-color .2s}
.search-row input:focus{border-color:var(--blue)}
.search-row button{height:46px;padding:0 26px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.search-row button:active{background:var(--blue-dark)}
.tips{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
.stats{max-width:720px;margin:14px auto 0;padding:0 16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.stats span{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 12px}
.content{max-width:720px;margin:16px auto 40px;padding:0 16px}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:14px;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(135deg,var(--blue-light),#fff);border-bottom:1px solid var(--border)}
.card-head .no{font-size:20px;font-weight:700;color:var(--blue-dark)}
.card-head .badge{font-size:12px;color:var(--green);background:#ecfdf5;border:1px solid #a7f3d0;border-radius:6px;padding:3px 10px}
.card-head .badge.gray{color:var(--muted);background:#f8fafc;border-color:var(--border)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.item{background:#fff;padding:12px 16px}
.item.full{grid-column:1/-1}
.item .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.item .v{font-size:15px;font-weight:600;word-break:break-all}
.item .v.hl{color:var(--blue);font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--blue-light);color:var(--blue-dark);border:1px solid #bfdbfe;border-radius:6px;padding:3px 10px;font-weight:500}
.empty{text-align:center;padding:50px 0;color:var(--muted);font-size:14px}
.empty .icon{font-size:44px;margin-bottom:10px}
.hl-text{background:#fef08a;border-radius:3px;padding:0 2px}
.candidate{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);cursor:pointer}
.candidate:last-child{border-bottom:none}
.candidate:active{background:var(--blue-light)}
.candidate .info b{font-size:16px;color:var(--blue-dark)}
.candidate .info span{font-size:12px;color:var(--muted);margin-left:10px}
.candidate .arrow{color:#cbd5e1}
.footer{text-align:center;font-size:11px;color:#94a3b8;padding-bottom:24px}
@media (max-width:480px){
  .header{padding:22px 16px 80px}
  .header h1{font-size:19px}
  .search-row button{padding:0 18px}
  .card-head .no{font-size:18px}
}
</style>
</head>

const kw = document.getElementById('kw');
const btn = document.getElementById('btn');
const result = document.getElementById('result');
const stats = document.getElementById('stats');

// 字段索引
const IDX = {};
HEADERS.forEach((h,i)=>IDX[h]=i);

function showStats(){
  stats.innerHTML = '<span>共 '+DATA.length+' 条</span><span>回车或点击"查询"按钮</span>';
}
showStats();

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function hl(v, q){
  v = esc(v);
  if(!q) return v;
  return v.split(esc(q)).join('<span class="hl-text">'+esc(q)+'</span>');
}

function rowCard(row, q){
  const g = i => esc(row[i]);
  const 委外 = ['委外窗协','委外木协','委外铺协','委外玻璃钢','委外钢门','委外塞拉门检修'];
  let tags = '';
  委外.forEach(name=>{
    const v = row[IDX[name]];
    tags += '<span class="tag">'+esc(name.replace('委外',''))+'：'+esc(v)+'</span>';
  });
  return '<div class="card">'
    + '<div class="card-head"><span class="no">'+g(IDX['车种'])+' '+g(IDX['车型'])+' '+g(IDX['车号'])+'</span>'
    + '<span class="badge">'+g(IDX['修程'])+'</span></div>'
    + '<div class="grid">'
    + '<div class="item"><div class="k">序号</div><div class="v">'+g(IDX['序号'])+'</div></div>'
    + '<div class="item"><div class="k">工作号</div><div class="v hl">'+hl(row[IDX['工作号']])+'</div></div>'
    + '<div class="item"><div class="k">配属局</div><div class="v">'+g(IDX['配属局'])+'</div></div>'
    + '<div class="item"><div class="k">制造工厂</div><div class="v">'+g(IDX['制造工厂'])+'</div></div>'
    + '<div class="item full"><div class="k">委外检修单位</div><div class="v" style="font-weight:400"><div class="tags">'+tags+'</div></div></div>'
    + '</div></div>';
}

function render(rows, q){
  if(rows.length === 0){
    result.innerHTML = '<div class="empty"><div class="icon">🔍</div>未找到工作号包含 "'+esc(q)+'" 的记录<br><br>请检查输入是否正确</div>';
    return;
  }
  let html = '';
  if(rows.length === 1){
    html = rowCard(rows[0], q);
  } else {
    // 多条：先显示候选列表
    html = '<div class="card"><div style="padding:12px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)">匹配到 '+rows.length+' 条记录，点击查看详情：</div>';
    rows.slice(0,50).forEach(r=>{
      html += '<div class="candidate" data-gz="'+esc(r[IDX['工作号']])+'">'
        + '<div class="info"><b>'+hl(r[IDX['工作号']])+'</b><span>'+esc(r[IDX['配属局']])+' · '+esc(r[IDX['车种']]+r[IDX['车型']])+' · 车号 '+esc(r[IDX['车号']])+'</span></div>'
        + '<span class="arrow">›</span></div>';
    });
    if(rows.length>50) html += '<div style="padding:12px;text-align:center;color:var(--muted);font-size:12px">仅显示前 50 条，请输入更精确的工作号</div>';
    html += '</div>';
  }
  result.innerHTML = html;
  // 候选项点击 → 展开为完整卡片
  result.querySelectorAll('.candidate').forEach(el=>{
    el.addEventListener('click', ()=>{
      const gz = el.dataset.gz;
      const r = DATA.find(x=>x[IDX['工作号']]===gz);
      if(r) result.innerHTML = rowCard(r, '');
    });
  });
}

  const q = kw.value.trim();
  if(!q){ result.innerHTML=''; showStats(); return; }
  const norm = s => String(s).replace(/[-－—–\s]/g,'').toLowerCase();
  const nq = norm(q);
  // 先精确匹配
  let rows = DATA.filter(r=>norm(r[IDX['工作号']])===nq);
  if(rows.length===0){
    // 模糊包含
    rows = DATA.filter(r=>norm(r[IDX['工作号']]).includes(nq));
  }
  stats.innerHTML = '<span>匹配 '+rows.length+' 条</span>';
  render(rows, q);
}

btn.addEventListener('click', doSearch);
kw.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
</script>
