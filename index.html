<style>
:root {
  --bg: #f5f7f5;
  --card-bg: #ffffff;
  --text: #2c3e2d;
  --text-light: #5a7d5c;
  --accent: #4a9e5c;
  --accent-light: #e8f5e9;
  --border: #dcedc8;
  --tag-bg: #e8f5e9;
  --tag-text: #2e7d32;

  --radius: 12px;

  --classic-bg: #e8eaf6;
  --combo-bg: #fff3e0;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #2e7d32 0%, #4a9e5c 50%, #66bb6a 100%);
  color: #fff;
  padding: 28px 20px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(46,125,50,0.2);
}
.header h1 { font-size: 1.6em; font-weight: 700; letter-spacing: 2px; }
.header p { font-size: 0.85em; opacity: 0.85; margin-top: 4px; }
.container { max-width: 960px; margin: 0 auto; padding: 16px; }
.search-box {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.search-box input {
  flex: 1;
  min-width: 200px;
  padding: 10px 16px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.filter-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.filter-btn {
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: var(--card-bg);
  color: var(--text-light);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.filter-btn:hover, .filter-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--accent);
  transition: transform 0.15s;
}
.card:hover { transform: translateY(-1px); }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-header .icon { font-size: 1.5em; }
.card-header h2 { font-size: 1.15em; color: #1b5e20; }
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
}
.tag-acupoint { background: #e8f5e9; color: #2e7d32; }
.tag-formula { background: #f3e5f5; color: #7b1fa2; }
.tag-disease { background: #fff3e0; color: #e65100; }
.tag-zangfu { background: #e3f2fd; color: #1565c0; }
.tag-classic { background: #e8eaf6; color: #283593; }
.acupoint-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.acupoint { background: var(--tag-bg); color: var(--tag-text); padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: 500; }
.section { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 14px; }
.section-formula { background: var(--formula-bg); }
.section-classic { background: var(--classic-bg); border-left: 3px solid #5c6bc0; }
.section-combo { background: var(--combo-bg); border-left: 3px solid #ff9800; }
.section-label { font-weight: 700; color: var(--text); margin-bottom: 4px; font-size: 13px; }
.section-label::before { content: '▸ '; color: var(--accent); }
.detail-item { padding: 3px 0; font-size: 13px; color: var(--text-light); }
.detail-item strong { color: var(--text); }
.highlight { background: #fff176; padding: 1px 3px; border-radius: 2px; }
.no-result { text-align: center; padding: 40px; color: var(--text-light); }
.category-title {
  font-size: 1.1em;
  font-weight: 700;
  color: #1b5e20;
  margin: 20px 0 10px;
  padding-left: 12px;
  border-left: 3px solid var(--accent);
}
.disease-section {
  background: #fafafa;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.disease-section h3 {
  font-size: 1em;
  color: #e65100;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px dashed var(--border);
}
.disease-formula { display: flex; flex-wrap: wrap; gap: 4px; }
.disease-tag {
  background: #fff3e0;
  color: #e65100;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.separator { color: #bbb; margin: 0 2px; }
.footer { text-align: center; padding: 30px; color: var(--text-light); font-size: 13px; }
@media (max-width: 600px) {
  .container { padding: 10px; }
  .card { padding: 14px; }
  .header h1 { font-size: 1.3em; }
}
</style>

      (c.combos || []).some(cb => cb.includes(searchTerm)) ||
      (c.indications || []).some(i => i.includes(searchTerm)) ||
      (c.notes || '').includes(searchTerm);
    
    if (matchFilter && matchSearch) {
      if (!categories[c.category]) categories[c.category] = [];
      categories[c.category].push(c);
    }
  });

  const catNames = { '心':'心系', '肾':'肾系', '肝':'肝系', '脾':'脾系' };
  for (const [cat, items] of Object.entries(categories)) {
    if (items.length === 0) continue;
    html += `<div class="category-title">${catNames[cat]}</div>`;
    items.forEach(c => {
      html += renderCard(c);
    });
  }

  // 疾病配阵
  if (currentFilter === 'all' || currentFilter === '安神' || currentFilter === '调神' || currentFilter === '解郁') {
    const matchedDiseases = diseases.filter(d => {
      if (currentFilter === 'all' && !searchTerm) return true;
      const matchFilter = currentFilter === 'all' || 
        d.formulas.some(f => f.includes(currentFilter));
      const matchSearch = !searchTerm || 
        d.name.includes(searchTerm) ||
        d.formulas.some(f => f.includes(searchTerm));
      return matchFilter && matchSearch;
    });
    if (matchedDiseases.length > 0) {
      html += `<div class="category-title">疾病配阵方案</div>`;
      matchedDiseases.forEach(d => {
        html += `<div class="disease-section">
          <h3>${highlight(d.name)}</h3>
          <div class="disease-formula">
            ${d.formulas.map(f => `<span class="disease-tag">${highlight(f)}</span>`).join('')}
          </div>
        </div>`;
      });
    }
  }

  if (html === '') {
    html = '<div class="no-result">未找到匹配的针阵或疾病方案</div>';
  }
  container.innerHTML = html;
}

function renderCard(c) {
  return `<div class="card">
    <div class="card-header">
      <span class="icon">${c.category === '心' ? '❤️' : c.category === '肾' ? '💧' : c.category === '肝' ? '🌿' : '🏔️'}</span>
      <h2>${highlight(c.name)}</h2>
    </div>
    <div class="card-tags">
      ${c.tags.map(t => `<span class="tag tag-${t === '安神' ? 'acupoint' : t === '温阳' ? 'formula' : t === '镇惊' ? 'disease' : t === '解郁' ? 'classic' : 'zangfu'}">${highlight(t)}</span>`).join('')}
    </div>
    <div class="acupoint-list">
      ${c.acupoints.map(a => `<span class="acupoint">${highlight(a)}</span>`).join(' ')}
    </div>
    ${(c.acupointDetails || []).length > 0 ? `
    <div class="section" style="background:#f1f8e9; margin-top:8px;">
      <div class="section-label">穴位详解</div>
      ${c.acupointDetails.map(d => `<div class="detail-item">${highlight(d)}</div>`).join('')}
    </div>` : ''}
    ${c.formulaDetail ? `
    <div class="section section-formula" style="margin-top:8px;">
      <div class="section-label">方义</div>
      <div class="detail-item">${highlight(c.formulaDetail)}</div>
    </div>` : ''}
    ${c.classic ? `
    <div class="section section-classic" style="margin-top:8px;">
      <div class="section-label">经典</div>
      <div class="detail-item" style="font-style:italic;">${highlight(c.classic)}</div>
    </div>` : ''}
    ${(c.combos || []).length > 0 ? `
    <div class="section section-combo" style="margin-top:8px;">
      <div class="section-label">配伍</div>
      ${c.combos.map(cb => `<div class="detail-item">${highlight(cb)}</div>`).join('')}
    </div>` : ''}
    ${c.notes ? `<div class="detail-item" style="margin-top:8px; color:#666;">${highlight(c.notes)}</div>` : ''}
  </div>`;
}

function highlight(text) {
  if (!searchTerm) return text;
  const escaped = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function filterCards() {
  searchTerm = document.getElementById('searchInput').value.trim();
  renderCards();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

renderCards();
</script>

</body>
</html>
